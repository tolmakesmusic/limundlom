<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weiterleitung…</title>

  <!-- Ziel-URL hier anpassen (3 Stellen: meta refresh, canonical, Script + Link) -->
  <meta http-equiv="refresh" content="0; url=https://example.com/">
  <link rel="canonical" href="podcast.tolmakesmusic.de">
  <meta name="robots" content="noindex">

  <script>
    window.location.replace("https://example.com/");
  </script>
</head>
<body>
  <p>Du wirst weitergeleitet. Falls nichts passiert, klicke bitte
     <a href="podcast.tolmakesmusic.de">hier</a>.</p>
</body>
</html>
